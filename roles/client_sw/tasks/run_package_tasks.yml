---

# Read package versions before changes
- include_tasks: read_package_version.yml
  vars:
    package: "{{ item.key }}"
    state: "{{ item.value }}"
    flag: beg
  loop: "{{ client_sw_pkg_state | oneidentity.authentication_services.pkgdict2items }}"

# Build and validate the complete Solaris operation plan before staging or
# package mutation. Other platforms retain their existing execution flow.
- include_tasks: build_package_plan.yml
  when: ansible_facts['os_family'] | lower == 'solaris'

# Create temporary directory
- include_tasks: temp_dir_create.yml
  when: 
    - "'present' in client_sw_pkg_state.values()"

# Perform package tasks  
- include_tasks: run_package_task.yml
  vars:
    package: "{{ item.key }}"
    state: "{{ item.value }}"
  loop: "{{ client_sw_pkg_state | oneidentity.authentication_services.pkgdict2items }}"

# Remove temporary directory 
# - include_tasks: temp_dir_delete.yml
#   when: 
#     - "'present' in client_sw_pkg_state.values()"

# Read package versions after changes
- include_tasks: read_package_version.yml
  vars:
    package: "{{ item.key }}"
    state: "{{ item.value }}"
    flag: end
  loop: "{{ client_sw_pkg_state | oneidentity.authentication_services.pkgdict2items }}"
